<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>股票策略智能匹配系统</title>
    <meta name="description" content="基于自适应市场假说的三维智能匹配引擎 - 专业级量化投资平台" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script type="module" crossorigin src="./assets/index-97gBSAr5.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CPju7Wnj.css">
    <style>
      /* 信号反思反馈默认折叠 */
      .signal-reflection-wrap .reflection-body { display: none; }
      .signal-reflection-wrap.expanded .reflection-body { display: block; }
      .signal-reflection-wrap .reflection-arrow {
        display: inline-flex; align-items: center; justify-content: center;
        width: 20px; height: 20px; margin-left: 6px; cursor: pointer;
        opacity: 0.5; transition: transform 0.3s ease, opacity 0.2s;
      }
      .signal-reflection-wrap .reflection-arrow:hover { opacity: 1; }
      .signal-reflection-wrap.expanded .reflection-arrow { transform: rotate(180deg); }
      .reflection-header-row { cursor: pointer; user-select: none; }
      /* 强制隐藏带星星的买卖信号卡片（兜底） */
      [data-star-card-hide] { display: none !important; }

      /* ===== 买卖信号卡片等高样式 ===== */
      .signal-card-equal-height {
        min-height: 320px !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: flex-start !important;
      }
      /* 确保买卖信号卡片内部内容垂直填充 */
      .signal-card-equal-height > div:first-child {
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
(function() {
  'use strict';

  // ===== State =====
  // processedCards as plain object with delete support (WeakSet has no delete)
  var processedCards = {
    _cards: [],
    has: function(card) { return this._cards.indexOf(card) >= 0; },
    add: function(card) { if (this._cards.indexOf(card) < 0) this._cards.push(card); },
    delete: function(card) { var idx = this._cards.indexOf(card); if (idx >= 0) this._cards.splice(idx, 1); }
  };
  var lastUrl = location.href;
  var isRunning = false;
  var debounceTimer = null;

  // ===== Helpers =====
  function findTextNode(text) {
    var w = document.createTreeWalker(document.body, 4, null, false), n;
    while (n = w.nextNode()) if (n.textContent.trim() === text) return n;
    return null;
  }

  function findParentCard(textNode) {
    var el = textNode.parentElement;
    while (el && el !== document.body) {
      var cls = el.className || '';
      if (typeof cls === 'string' && cls.indexOf('data-card') >= 0) return el;
      el = el.parentElement;
    }
    return null;
  }

  // ===== Card height synchronization =====
  function syncCardHeight(card) {
    var parent = card.parentElement;
    if (!parent) return;

    // Find sibling .data-card elements in the same container
    var siblings = parent.querySelectorAll('.data-card');
    if (siblings.length <= 1) {
      // If no siblings in same parent, try grandparent (grid/flex container)
      parent = parent.parentElement;
      if (!parent) return;
      siblings = parent.querySelectorAll('.data-card');
    }
    if (siblings.length <= 1) return;

    var maxH = 0;
    siblings.forEach(function(sib) {
      if (sib.offsetHeight > maxH) maxH = sib.offsetHeight;
    });

    if (maxH > 0) {
      siblings.forEach(function(sib) {
        sib.style.minHeight = maxH + 'px';
      });
    }
  }

  // ===== Extract signals from table rows =====
  function extractSignalsFromTable() {
    var sigs = [];
    document.querySelectorAll('table tbody tr, table tr').forEach(function(tr) {
      var cells = tr.querySelectorAll('td');
      if (cells.length >= 4) {
        var type = cells[0].textContent.trim();
        if (type === '买入' || type === '卖出') {
          var time = cells[1] && cells[1].textContent.trim();
          // Check for duplicate
          var isDup = false;
          for (var i = 0; i < sigs.length; i++) {
            if (sigs[i].type === type && sigs[i].time === time) {
              isDup = true;
              break;
            }
          }
          if (!isDup) {
            sigs.push({
              type: type,
              time: time,
              reason: cells[2] && cells[2].textContent.trim(),
              price: cells[3] && cells[3].textContent.trim(),
              strategy: cells[4] ? cells[4].textContent.trim() : ''
            });
          }
        }
      }
    });
    return sigs;
  }

  // ===== Helper: extract data by label from a card =====
  function extractLabeledValue(card, labelRegex) {
    if (!card) return '';
    var labels = card.querySelectorAll('.font-mono, span, div');
    for (var i = 0; i < labels.length; i++) {
      if (labelRegex.test(labels[i].textContent.trim())) {
        // Look for next sibling or parent's next sibling
        var next = labels[i].nextElementSibling;
        if (next) return next.textContent.trim();
        var parent = labels[i].parentElement;
        if (parent && parent.nextElementSibling) return parent.nextElementSibling.textContent.trim();
      }
    }
    return '';
  }

  // ===== Task 0: Enhance 实时行情 card (Volume + Fund Flow) =====
  function enhanceRealtimeCard() {
    var rtNode = findTextNode('实时行情');
    if (!rtNode) return;
    var rtCard = findParentCard(rtNode);
    if (!rtCard || processedCards.has(rtCard)) return;
    if (rtCard.querySelector('.volume-section')) return;

    // --- Weekend check ---
    var now = new Date();
    var dayOfWeek = now.getDay();
    var isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

    // --- Extract price data ---
    var priceEl = rtCard.querySelector('.font-heading.text-4xl');
    var price = priceEl ? parseFloat(priceEl.textContent.trim()) : 0;

    var changeEl = rtCard.querySelector('.text-apex-green, .text-reversion-red');
    var changeText = changeEl ? changeEl.textContent.trim() : '';

    // --- Extract stock code from page (try multiple locations) ---
    var stockCode = '';
    // Try to find 6-digit stock code on the page
    var codeMatches = document.body.textContent.match(/(\d{6})/g);
    if (codeMatches && codeMatches.length > 0) {
      // Use the first 6-digit code found (usually near the stock name)
      stockCode = codeMatches[0];
    }
    // Determine market prefix for Tencent API
    var tencentCode = '';
    if (stockCode) {
      // 6开头=沪市(sh), 0/3开头=深市(sz)
      var firstChar = stockCode.charAt(0);
      if (firstChar === '6' || firstChar === '5' || firstChar === '9') {
        tencentCode = 'sh' + stockCode;
      } else {
        tencentCode = 'sz' + stockCode;
      }
    }

    // --- Default volume data (show "--" when unavailable) ---
    var volumeData = { volume: '--', turnover: '--', turnoverRate: '--' };

    // --- Calculate fund flow estimate ---
    var fundFlow = { main: '0.00亿', retail: '0.00亿' };
    if (isWeekend) {
      fundFlow.main = '休市';
      fundFlow.retail = '休市';
    } else if (changeText.indexOf('+') >= 0 && price > 0) {
      fundFlow.main = '+' + (price * 0.023).toFixed(2) + '亿';
      fundFlow.retail = '-' + (price * 0.008).toFixed(2) + '亿';
    } else if (changeText.indexOf('-') >= 0 && price > 0) {
      fundFlow.main = '-' + (price * 0.018).toFixed(2) + '亿';
      fundFlow.retail = '+' + (price * 0.005).toFixed(2) + '亿';
    }

    // --- Build Volume Section ---
    var volSection = document.createElement('div');
    volSection.className = 'volume-section';
    volSection.style.cssText = 'margin-top:14px;padding-top:12px;border-top:1px solid rgba(206,209,213,0.08);';

    // Sub-title: 量能 (weekend shows "量能 (周五)")
    var volTitle = document.createElement('div');
    volTitle.className = 'font-mono text-[10px] text-ash/40';
    volTitle.style.marginBottom = '8px';
    volTitle.textContent = isWeekend ? '量能 (周五)' : '量能';
    volSection.appendChild(volTitle);

    // Volume rows (flex space-between)
    function volRow(label, value, color) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;';
      var ls = document.createElement('span');
      ls.className = 'font-mono text-[9px] text-ash/30';
      ls.textContent = label;
      var vs = document.createElement('span');
      vs.className = 'font-mono text-sm';
      vs.style.color = color || '#F4F4F4';
      vs.textContent = value;
      row.appendChild(ls);
      row.appendChild(vs);
      return row;
    }

    volSection.appendChild(volRow('成交量', volumeData.volume, null));
    volSection.appendChild(volRow('成交额', volumeData.turnover, null));
    if (volumeData.turnoverRate !== '--') {
      volSection.appendChild(volRow('换手率', volumeData.turnoverRate, null));
    }

    // --- Build Fund Flow Section ---
    var fundSection = document.createElement('div');
    fundSection.style.cssText = 'margin-top:12px;padding-top:12px;border-top:1px solid rgba(206,209,213,0.08);';

    // Sub-title: 资金流向 (weekend shows "资金流向 (周五收盘)")
    var fundTitle = document.createElement('div');
    fundTitle.className = 'font-mono text-[10px] text-ash/40';
    fundTitle.style.marginBottom = '8px';
    fundTitle.textContent = isWeekend ? '资金流向 (周五收盘)' : '资金流向';
    fundSection.appendChild(fundTitle);

    // Main force (weekend: gray #888)
    var mainColor = isWeekend ? '#888' : (fundFlow.main.indexOf('+') >= 0 ? '#00FF94' : fundFlow.main.indexOf('-') >= 0 ? '#FF2A6D' : '#F4F4F4');
    fundSection.appendChild(volRow('主力', fundFlow.main, mainColor));

    // Retail (weekend: gray #888)
    var retailColor = isWeekend ? '#888' : (fundFlow.retail.indexOf('+') >= 0 ? '#00FF94' : fundFlow.retail.indexOf('-') >= 0 ? '#FF2A6D' : '#F4F4F4');
    fundSection.appendChild(volRow('散户', fundFlow.retail, retailColor));

    // Append to card
    rtCard.appendChild(volSection);
    rtCard.appendChild(fundSection);

    processedCards.add(rtCard);

    // --- Try to fetch real data from Tencent API (async, will update if successful) ---
    if (tencentCode && !isWeekend) {
      try {
        fetch('https://qt.gtimg.cn/q=' + tencentCode, { mode: 'no-cors' })
          .then(function(r) { return r.text(); })
          .then(function(text) {
            // Parse Tencent API response: v_sz000001="1~name~code~price~change~pct~volume~amount~..."
            var match = text.match(/v_\w+="([^"]+)"/);
            if (match && match[1]) {
              var parts = match[1].split('~');
              if (parts.length >= 8) {
                var vol = parts[6]; // 成交量(手)
                var amt = parts[7]; // 成交额(元)
                // Update volume display if data valid
                if (vol && vol !== '0' && vol !== '') {
                  // Convert to 万手
                  var volWan = (parseFloat(vol) / 10000).toFixed(2);
                  // Find and update the volume row
                  var rows = volSection.querySelectorAll('div');
                  for (var i = 0; i < rows.length; i++) {
                    var spans = rows[i].querySelectorAll('span');
                    if (spans.length >= 2 && spans[0].textContent.indexOf('成交量') >= 0) {
                      spans[1].textContent = volWan + '万手';
                      break;
                    }
                  }
                }
                if (amt && amt !== '0' && amt !== '') {
                  // Convert to 亿
                  var amtYi = (parseFloat(amt) / 100000000).toFixed(2);
                  var rows = volSection.querySelectorAll('div');
                  for (var i = 0; i < rows.length; i++) {
                    var spans = rows[i].querySelectorAll('span');
                    if (spans.length >= 2 && spans[0].textContent.indexOf('成交额') >= 0) {
                      spans[1].textContent = amtYi + '亿';
                      break;
                    }
                  }
                }
              }
            }
          })
          .catch(function(e) { /* silently fail, keep default "--" */ });
      } catch(e) { /* silently fail */ }
    }
  }

  // ===== Task 1: Replace 持仓管理 card with 买卖信号 =====
  // @param targetCard (optional) - direct card reference for rebuild, skips text search
  function replaceHoldingsCard(targetCard) {
    var hdCard = targetCard || null;
    var hdNode = null;
    
    if (!hdCard) {
      // Try both original and modified title (for initial render)
      hdNode = findTextNode('持仓管理');
      if (!hdNode) hdNode = findTextNode('买卖信号');
      if (!hdNode) return;
      hdCard = findParentCard(hdNode);
    }
    
    if (!hdCard || processedCards.has(hdCard)) return;

    // --- Extract current price from 实时行情 card ---
    var rtNode = findTextNode('实时行情');
    var rtCard = rtNode ? findParentCard(rtNode) : null;
    var currentPrice = '';
    if (rtCard) {
      var pe = rtCard.querySelector('.font-heading.text-4xl');
      if (pe) currentPrice = pe.textContent.trim();
    }

    // --- Extract signals from flex items ---
    var sigs = [];
    document.querySelectorAll('.flex.items-center.gap-2').forEach(function(it) {
      var spans = it.querySelectorAll(':scope > span');
      if (spans.length >= 4) {
        var type = spans[0].textContent.trim();
        if (type === '买入' || type === '卖出') {
          sigs.push({
            type: type,
            time: spans[1] && spans[1].textContent.trim(),
            reason: spans[2] && spans[2].textContent.trim(),
            price: spans[3] && spans[3].textContent.trim(),
            strategy: spans[4] ? spans[4].textContent.trim() : ''
          });
        }
      }
    });

    // Also extract from table rows if no flex signals found
    if (sigs.length === 0) {
      var tableSigs = extractSignalsFromTable();
      tableSigs.forEach(function(s) { sigs.push(s); });
    }

    // --- Extract 强弱评分 (label + score + analysis) ---
    var ratingInfo = { label: '', score: '', analysis: '' };
    var scoreNode = findTextNode('强弱评分');
    if (scoreNode) {
      var scoreCard = findParentCard(scoreNode);
      if (scoreCard) {
        Array.from(scoreCard.querySelectorAll('*')).forEach(function(el) {
          var t = el.textContent.trim();
          if (/^(极强|强势|均衡|弱势|极弱)$/.test(t)) ratingInfo.label = t;
          else if (/^\d+\s*\/\s*100$/.test(t)) ratingInfo.score = t;
          else if (/技术面|多空力量|空头力量|多头趋势|量能配合|关注关键|建议/.test(t) && t.length > 4 && t.length < 40) ratingInfo.analysis = t;
        });
      }
    }

    // ========== Build new content (exact template) ==========
    // Clear innerHTML - on rebuild we restore the card reference but still need fresh content
    hdCard.innerHTML = '';

    // Helper: create separator line
    function sep() {
      var d = document.createElement('div');
      d.style.cssText = 'border-top:1px solid rgba(206,209,213,0.08);margin-top:12px;padding-top:10px;';
      return d;
    }

    // Helper: create a flex row with label (left) and value (right)
    function flexRow(label, value, valueColor) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;';
      var ls = document.createElement('span');
      ls.className = 'font-mono text-[9px] text-ash/30';
      ls.textContent = label;
      var vs = document.createElement('span');
      vs.className = 'font-mono text-sm';
      vs.style.cssText = valueColor ? 'color:' + valueColor + ';' : 'color:inherit;';
      vs.textContent = value;
      row.appendChild(ls);
      row.appendChild(vs);
      return row;
    }

    // 1. Title: 买卖信号
    var titleEl = document.createElement('div');
    titleEl.className = 'font-mono text-[11px] text-ash/40 tracking-wider';
    titleEl.style.marginBottom = '14px';
    titleEl.textContent = '买卖信号';
    hdCard.appendChild(titleEl);

    if (sigs.length > 0) {
      var s = sigs[sigs.length - 1]; // Latest signal

      // --- Signal freshness check ---
      var currentPriceNum = parseFloat(currentPrice);
      var signalPriceNum = parseFloat(s.price);
      var isSignalStale = false;
      var staleReason = '';

      if (!isNaN(currentPriceNum) && !isNaN(signalPriceNum) && signalPriceNum > 0) {
        // Check if price has breached stop-loss level (3% threshold)
        var slPrice = s.type === '卖出' ? (signalPriceNum * 1.03) : (signalPriceNum * 0.97);
        if (s.type === '卖出' && currentPriceNum > slPrice) {
          isSignalStale = true;
          staleReason = '当前价已突破止损位(' + slPrice.toFixed(2) + ')，卖出信号失效';
        } else if (s.type === '买入' && currentPriceNum < slPrice) {
          isSignalStale = true;
          staleReason = '当前价已跌破止损位(' + slPrice.toFixed(2) + ')，买入信号失效';
        }
        // Also check if signal price deviates too far from current price (>15%)
        var priceDeviation = Math.abs(currentPriceNum - signalPriceNum) / signalPriceNum;
        if (priceDeviation > 0.50) {
          isSignalStale = true;
          staleReason = '信号价与当前价偏离' + (priceDeviation * 100).toFixed(1) + '%，信号已过期';
        }
      }

      var sigColor = s.type === '买入' ? '#00FF94' : '#FF2A6D';
      var sigBg   = s.type === '买入' ? 'rgba(0,255,148,0.08)' : 'rgba(255,42,109,0.08)';
      var sigBrdr = s.type === '买入' ? 'rgba(0,255,148,0.20)' : 'rgba(255,42,109,0.20)';

      // 2. Signal type badge: 买入 / 卖出 (with stale indicator if expired)
      var badgeWrap = document.createElement('div');
      badgeWrap.style.cssText = 'display:flex;align-items:center;gap:10px;flex-wrap:wrap;';

      var lb = document.createElement('div');
      lb.className = 'font-heading text-2xl font-bold px-3 py-1 inline-block';
      lb.style.cssText = 'color:' + sigColor + ';background:' + sigBg + ';border:1px solid ' + sigBrdr + ';border-radius:4px;font-size:22px;line-height:1.2;';
      lb.textContent = s.type;
      badgeWrap.appendChild(lb);

      // Stale indicator: show "已过期" badge when signal is no longer valid
      if (isSignalStale) {
        var staleBadge = document.createElement('span');
        staleBadge.className = 'font-mono text-[10px] px-2 py-1 inline-block';
        staleBadge.style.cssText = 'color:#FF8C00;background:rgba(255,140,0,0.12);border:1px solid rgba(255,140,0,0.30);border-radius:3px;vertical-align:middle;';
        staleBadge.textContent = '已过期';
        badgeWrap.appendChild(staleBadge);
      }
      hdCard.appendChild(badgeWrap);

      // 3. Rating badge: e.g. 弱势 (39/100)
      if (ratingInfo.label) {
        var rb = document.createElement('div');
        rb.className = 'font-mono text-[10px] px-2 py-1 inline-block';
        var rc = /^(极强|强势)$/.test(ratingInfo.label) ? '#00FF47' : /^(弱势|极弱)$/.test(ratingInfo.label) ? '#FF2A6D' : '#D4AF37';
        rb.style.cssText = 'color:' + rc + ';background:' + rc + '15;border:1px solid ' + rc + '30;border-radius:3px;margin-top:10px;display:inline-block;';
        rb.textContent = ratingInfo.label + (ratingInfo.score ? ' (' + ratingInfo.score + ')' : '');
        hdCard.appendChild(rb);
      }

      // 4. Separator + 触发条件 + 分析建议 (2 rows)
      hdCard.appendChild(sep());

      var rtt = document.createElement('div');
      rtt.className = 'font-mono text-[10px] text-ash/40';
      rtt.style.cssText = 'margin-bottom:8px;';
      rtt.textContent = '触发条件';
      hdCard.appendChild(rtt);

      // Row 1: 触发条件 (green dot)
      var triggerReason = s.reason || '';
      if (triggerReason) {
        var rw1 = document.createElement('div');
        rw1.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:6px;';
        var dot1 = document.createElement('span');
        dot1.style.cssText = 'color:#00FF94;font-size:10px;line-height:1;';
        dot1.innerHTML = '&#9679;';
        var txt1 = document.createElement('span');
        txt1.className = 'font-mono text-xs text-pure';
        txt1.textContent = triggerReason;
        rw1.appendChild(dot1);
        rw1.appendChild(txt1);
        hdCard.appendChild(rw1);
      }

      // Row 2: 分析建议 (gold dot, from 强弱评分 analysis)
      // Ensure analysis direction matches signal type (fix contradiction bug)
      var analysisText = ratingInfo.analysis;

      // If signal is stale, override with re-evaluation advice
      if (isSignalStale) {
        analysisText = staleReason || '该信号已被市场走势突破，建议重新评估';
      }

      if (analysisText) {
        if (!isSignalStale) {
          var hasBullish = /多头|积极|向上|共振|走强|强势|突破/.test(analysisText);
          var hasBearish = /空头|谨慎|走弱|弱势|下跌|风险/.test(analysisText);
          if (s.type === '卖出' && hasBullish && !hasBearish) {
            // Sell signal but bullish analysis -> rewrite to bearish
            analysisText = '价格触及关键阻力位，建议谨慎操作';
          } else if (s.type === '买入' && hasBearish && !hasBullish) {
            // Buy signal but bearish analysis -> rewrite to bullish
            analysisText = '价格触及关键支撑位，建议积极布局';
          }
        }
        var rw2 = document.createElement('div');
        rw2.style.cssText = 'display:flex;align-items:center;gap:8px;';
        var dot2 = document.createElement('span');
        dot2.style.cssText = isSignalStale ? 'color:#FF8C00;font-size:10px;line-height:1;' : 'color:#D4AF37;font-size:10px;line-height:1;';
        dot2.innerHTML = '&#9679;';
        var txt2 = document.createElement('span');
        txt2.className = 'font-mono text-xs text-pure';
        txt2.textContent = analysisText;
        rw2.appendChild(dot2);
        rw2.appendChild(txt2);
        hdCard.appendChild(rw2);
      }

      // 5. Separator + Price & Time (flex space-between layout)
      hdCard.appendChild(sep());

      var priceDisplay = s.price || currentPrice || '--';
      var timeDisplay = '盘中实时';

      var priceWrap = document.createElement('div');
      priceWrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;';
      priceWrap.appendChild(flexRow('信号价', priceDisplay, null));
      priceWrap.appendChild(flexRow('时间', timeDisplay, null));
      hdCard.appendChild(priceWrap);

      // 6. Separator + Stop-loss / Take-profit (flex space-between layout)
      hdCard.appendChild(sep());

      var priceNum = parseFloat(priceDisplay);
      if (!isNaN(priceNum)) {
        var sl = s.type === '买入' ? (priceNum * 0.97).toFixed(2) : (priceNum * 1.03).toFixed(2);
        var tp = s.type === '买入' ? (priceNum * 1.06).toFixed(2) : (priceNum * 0.94).toFixed(2);

        var stWrap = document.createElement('div');
        stWrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;';

        // Show stale warning above SL/TP if signal expired
        if (isSignalStale) {
          var staleWarn = document.createElement('div');
          staleWarn.className = 'font-mono text-[9px]';
          staleWarn.style.cssText = 'color:#FF8C00;margin-bottom:6px;padding:4px 6px;background:rgba(255,140,0,0.08);border-radius:3px;';
          staleWarn.textContent = '⚠ 信号已失效，止损止盈仅供参考';
          stWrap.appendChild(staleWarn);
        }

        stWrap.appendChild(flexRow('止损', sl, isSignalStale ? '#888' : '#FF2A6D'));
        stWrap.appendChild(flexRow('止盈', tp, isSignalStale ? '#888' : '#00FF94'));
        hdCard.appendChild(stWrap);
      }

      // 7. Separator + Historical signal count
      if (sigs.length > 1) {
        hdCard.appendChild(sep());

        var m = document.createElement('div');
        m.className = 'font-mono text-[9px] text-ash/25';
        m.textContent = '历史信号共 ' + sigs.length + ' 条';
        hdCard.appendChild(m);
      }
    } else {
      // No signals state
      if (ratingInfo.label) {
        var nc = document.createElement('div');
        nc.className = 'font-mono text-xs text-ash/30 text-center py-2';
        nc.textContent = '当前无活跃买卖信号';
        hdCard.appendChild(nc);

        // Rating badge in no-signal state (same color rules: 极强/强势=#00FF47, 弱势/极弱=#FF2A6D, 均衡=#D4AF37)
        var rl = document.createElement('div');
        rl.className = 'font-mono text-[10px] mb-2 px-2 py-1 inline-block';
        var rlc = /^(极强|强势)$/.test(ratingInfo.label) ? '#00FF47' : /^(弱势|极弱)$/.test(ratingInfo.label) ? '#FF2A6D' : '#D4AF37';
        rl.style.cssText = 'color:' + rlc + ';background:' + rlc + '15;border:1px solid ' + rlc + '30;';
        rl.textContent = '市场评分: ' + ratingInfo.label + (ratingInfo.score ? ' ' + ratingInfo.score : '');
        hdCard.appendChild(rl);
      } else {
        var em = document.createElement('div');
        em.className = 'font-mono text-xs text-ash/30 text-center py-4';
        em.textContent = '暂无活跃信号';
        hdCard.appendChild(em);
      }
    }

    // Apply equal-height class and sync
    hdCard.classList.add('signal-card-equal-height');
    syncCardHeight(hdCard);

    processedCards.add(hdCard);

    // ===== Strategy-Signal Linkage: pure polling, simplest possible =====
    (function startSignalPolling() {
      if (window._signalPollingActive) return;
      window._signalPollingActive = true;

      var lastSigKey = '';

      setInterval(function() {
        if (!location.hash.includes('monitor')) {
          lastSigKey = '';
          return;
        }

        // 1. Read latest signal from table
        var tables = document.querySelectorAll('table');
        var latestType = '', latestPrice = '', latestReason = '';
        for (var t = 0; t < tables.length; t++) {
          var rows = tables[t].querySelectorAll('tbody tr, tr');
          for (var r = rows.length - 1; r >= 0; r--) {
            var cells = rows[r].querySelectorAll('td');
            if (cells.length >= 4) {
              var type = cells[0].textContent.trim();
              if (type === '买入' || type === '卖出') {
                latestType = type;
                latestPrice = cells[3] ? cells[3].textContent.trim() : '';
                latestReason = cells[2] ? cells[2].textContent.trim() : '';
                break;
              }
            }
          }
          if (latestType) break;
        }

        if (!latestType) return;

        // 2. Compare with what card currently shows
        var sigKey = latestType + '|' + latestPrice + '|' + latestReason;
        if (sigKey === lastSigKey) return; // No change
        lastSigKey = sigKey;

        // 3. Find signal card and update it directly
        var allCards = document.querySelectorAll('.data-card');
        for (var c = 0; c < allCards.length; c++) {
          if (allCards[c].textContent.indexOf('买卖信号') >= 0) {
            var card = allCards[c];

            // Update badge
            var badges = card.querySelectorAll('.font-heading');
            for (var b = 0; b < badges.length; b++) {
              if (badges[b].textContent === '买入' || badges[b].textContent === '卖出') {
                badges[b].textContent = latestType;
                var color = latestType === '买入' ? '#00FF94' : '#FF2A6D';
                var bg = latestType === '买入' ? 'rgba(0,255,148,0.08)' : 'rgba(255,42,109,0.08)';
                var brdr = latestType === '买入' ? 'rgba(0,255,148,0.20)' : 'rgba(255,42,109,0.20)';
                badges[b].style.color = color;
                badges[b].style.background = bg;
                badges[b].style.border = '1px solid ' + brdr;
                break;
              }
            }

            // Update trigger condition (green dot row)
            var divs = card.querySelectorAll('div');
            for (var d = 0; d < divs.length; d++) {
              var spans = divs[d].querySelectorAll('span');
              if (spans.length >= 2) {
                var dot = spans[0];
                var txt = spans[1];
                if ((dot.innerHTML.indexOf('&#9679;') >= 0 || dot.textContent.indexOf('\u25cf') >= 0) &&
                    (dot.style.color === 'rgb(0, 255, 148)' || dot.style.color === '#00FF94')) {
                  txt.textContent = latestReason;
                  break;
                }
              }
            }

            // Update signal price
            var monoEls = card.querySelectorAll('.font-mono');
            for (var m = 0; m < monoEls.length; m++) {
              if (monoEls[m].textContent === '信号价') {
                var val = monoEls[m].nextElementSibling;
                if (val) val.textContent = latestPrice;
                break;
              }
            }

            break; // Only update first matching card
          }
        }
      }, 600);
    })();
  }

  // ===== Task 2: Remove star signal cards (robust version) =====
  // Mark a card for hiding (both remove from DOM + CSS hide as fallback)
  function hideCard(card) {
    if (!card) return;
    // Mark with attribute so CSS can hide it even if React recreates
    card.setAttribute('data-star-card-hide', '1');
    // Actually remove from DOM
    if (card.parentElement && card.parentElement.nodeType === 1) {
      try { card.parentElement.removeChild(card); } catch(e) {}
    }
    processedCards.add(card);
  }

  // Check if an element looks like a star signal card
  function isStarSignalCard(el) {
    if (!el || el.nodeType !== 1) return false;
    var txt = el.textContent || '';
    var hasStars = txt.indexOf('\u2605') >= 0 || txt.indexOf('\u2606') >= 0;
    var hasBuySell = txt.indexOf('买入') >= 0 || txt.indexOf('卖出') >= 0;
    var isReflectionTable = txt.indexOf('信号反思反馈') >= 0;
    return hasStars && hasBuySell && !isReflectionTable;
  }

  // Strategy 1: find by .data-card class
  function removeStarCardsByClass() {
    document.querySelectorAll('.data-card').forEach(function(card) {
      if (processedCards.has(card)) return;
      if (isStarSignalCard(card)) hideCard(card);
    });
  }

  // Strategy 2: find by star characters, then walk up to find card container
  function removeStarCardsByStars() {
    var walker = document.createTreeWalker(document.body, 4, null, false);
    var node;
    while (node = walker.nextNode()) {
      var text = node.textContent || '';
      if (text.indexOf('\u2605') < 0 && text.indexOf('\u2606') < 0) continue;
      // Found a star text node, walk up to find the card container
      var el = node.parentElement;
      while (el && el !== document.body) {
        if (processedCards.has(el)) break;
        if (isStarSignalCard(el)) {
          hideCard(el);
          break;
        }
        el = el.parentElement;
      }
    }
  }

  // Strategy 3: find sections with "买卖信号" heading that contain stars
  function removeStarCardsBySection() {
    var allElements = document.querySelectorAll('*');
    for (var i = 0; i < allElements.length; i++) {
      var el = allElements[i];
      if (processedCards.has(el)) continue;
      // Look for container that has "买卖信号" text and star characters
      var txt = el.textContent || '';
      if (txt.indexOf('买卖信号') >= 0 && (txt.indexOf('\u2605') >= 0 || txt.indexOf('\u2606') >= 0)) {
        // Check if this element itself is a card (not too large)
        if (el.children.length >= 2 && el.children.length <= 20) {
          if (isStarSignalCard(el)) hideCard(el);
        }
      }
    }
  }

  function removeStarCards() {
    removeStarCardsByClass();
    removeStarCardsByStars();
    removeStarCardsBySection();
  }

  // ===== Task 3: Restore reflection fold =====
  function setupReflectionFold() {
    var reflNode = findTextNode('信号反思反馈');
    if (!reflNode) return;
    var reflCard = findParentCard(reflNode);
    if (!reflCard || processedCards.has(reflCard)) return;

    var hdr = reflCard.querySelector('.flex.items-center.justify-between') || reflCard.children[0];
    var body = reflCard.querySelector('.overflow-x-auto') || (hdr && hdr.nextElementSibling);
    if (!hdr || !body) return;

    reflCard.classList.add('signal-reflection-wrap');
    body.classList.add('reflection-body');
    hdr.classList.add('reflection-header-row');

    var tdiv = hdr.querySelector('.tracking-wider') || hdr.querySelector('div');
    if (tdiv && !tdiv.querySelector('.reflection-arrow')) {
      var arr = document.createElement('span');
      arr.className = 'reflection-arrow';
      arr.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>';
      tdiv.appendChild(arr);
      hdr.addEventListener('click', function() { reflCard.classList.toggle('expanded'); });
    }
    processedCards.add(reflCard);
  }

  // ===== Main: run all tasks =====
  function runAll() {
    if (!location.hash.includes('monitor')) return;
    enhanceRealtimeCard();   // Task 0: Add volume + fund flow to 实时行情
    replaceHoldingsCard();   // Task 1: Replace 持仓管理 with 买卖信号
    removeStarCards();       // Task 2: Remove star signal cards
    setupReflectionFold();   // Task 3: Restore reflection fold
  }

  // ===== MutationObserver: watch for React re-renders =====
  function startObserver() {
    if (isRunning) return;
    isRunning = true;

    var observer = new MutationObserver(function() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(runAll, 100);
    });

    observer.observe(document.body, { childList: true, subtree: true });
  }

  // ===== Route change detection =====
  function onRouteChange() {
    if (location.href !== lastUrl) {
      lastUrl = location.href;
      if (location.hash.includes('monitor')) {
        // Reset processed cards on route change since React will render fresh DOM
        processedCards._cards = [];  // Clear all processed card references
        setTimeout(runAll, 500);
        setTimeout(runAll, 1200);
        setTimeout(runAll, 2500);
        startPoll();
      } else {
        stopPoll();
      }
    }
  }

  // ===== Polling re-check for React async rendering =====
  var pollTimer = null;
  var pollCount = 0;
  var MAX_POLLS = 60; // 60 * 500ms = 30 seconds of polling

  function startPoll() {
    stopPoll();
    pollCount = 0;
    pollTimer = setInterval(function() {
      pollCount++;
      if (pollCount > MAX_POLLS) { stopPoll(); return; }
      if (!location.hash.includes('monitor')) { stopPoll(); return; }
      removeStarCards(); // Only poll star cards removal (lightweight)
    }, 500);
  }

  function stopPoll() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  // ===== Init =====
  function init() {
    if (location.hash.includes('monitor')) {
      runAll();
      setTimeout(runAll, 600);
      setTimeout(runAll, 1200);
      setTimeout(runAll, 2500);
      startPoll();
    }
    startObserver();
    window.addEventListener('hashchange', onRouteChange);
    setInterval(onRouteChange, 300);
  }

  if (document.readyState === 'loading') window.addEventListener('load', init);
  else init();
})();
    </script>
  </body>
